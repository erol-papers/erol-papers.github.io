<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>People — Hepataug</title>
  
  <!-- Import Montserrat and Inter Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary: #4B2E2E;          
      --accent: #C86D51;           
      --bg: #FFFFFF;               
      --surface: #FAF7F5;          
      --surface-tint: #F3EFEA;     
      --text-main: #2C2424;        
      --text-muted: #5E5050;       
      --border: #E8E1DC;
      --radius: 16px;
      --max-width: 1100px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text-main);
      line-height: 1.75;
      -webkit-font-smoothing: antialiased;
    }

    /* Seamless Banner */
    .banner-wrapper {
      background: var(--bg);
      padding: 40px 0 20px;
      text-align: center;
    }

    .banner-wrapper img {
      max-width: var(--max-width);
      width: 100%;
      height: auto;
      display: block;
      margin: 0 auto;
      padding: 0 24px;
    }

    /* Navigation Bar matching Banner Width */
    header {
      background: var(--bg);
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(8px);
      padding: 12px 0;
    }

    nav {
      max-width: var(--max-width);
      width: 100%;
      margin: 0 auto;
      padding: 0 24px;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    /* Main Navigation Pill Group */
    .nav-links {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--surface);
      padding: 6px;
      border-radius: 50px;
      flex: 1;
    }

    .nav-links a {
      text-decoration: none;
      color: var(--text-muted);
      font-weight: 500;
      font-size: 0.92rem;
      transition: all 0.2s ease;
      white-space: nowrap;
      padding: 8px 20px;
      border-radius: 30px;
      text-align: center;
      flex: 1;
    }

    .nav-links a:hover {
      color: var(--primary);
      background: rgba(75, 46, 46, 0.04);
    }

    .nav-links a.active {
      color: #FFFFFF;
      background: var(--primary);
      font-weight: 600;
      box-shadow: 0 4px 12px rgba(75, 46, 46, 0.15);
    }

    /* IMMORTALLS Companion Link Button */
    .nav-immortalls {
      text-decoration: none;
      background: var(--surface);
      color: var(--primary);
      font-weight: 600;
      font-size: 0.92rem;
      padding: 14px 22px;
      border-radius: 50px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
      transition: all 0.2s ease;
      border: 1px solid var(--border);
    }

    .nav-immortalls:hover {
      background: var(--primary);
      color: #FFFFFF;
      border-color: var(--primary);
      transform: translateY(-1px);
    }

    .nav-immortalls svg {
      width: 14px;
      height: 14px;
      fill: currentColor;
    }

    /* Main Container */
    .container {
      max-width: var(--max-width);
      margin: 48px auto 64px;
      padding: 0 24px;
    }

    .page-title {
      font-size: 2rem;
      color: var(--primary);
      font-weight: 700;
      margin-bottom: 28px;
      letter-spacing: -0.02em;
    }

    /* Team List Styling matching Publications aesthetic */
    .team-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .member-card {
      background: var(--surface);
      padding: 24px;
      margin: 16px 0;
      border-radius: var(--radius);
      border: 1px solid transparent;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    }

    .member-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 30px -10px rgba(75, 46, 46, 0.08);
      border-color: var(--border);
    }

    .member-info p {
      margin: 0;
      font-size: 0.95rem;
    }

    .member-info strong {
      font-size: 1.15rem;
      color: var(--primary);
      font-weight: 600;
    }

    .member-info .role {
      color: var(--text-muted);
      margin-left: 8px;
      font-weight: 500;
    }

    .btn {
      text-decoration: none;
      background: var(--surface-tint);
      color: var(--primary);
      padding: 8px 16px;
      border-radius: 10px;
      font-size: 0.9rem;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      border: 1px solid var(--border);
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .btn svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
      display: block;
    }

    .btn:hover {
      background: var(--primary);
      color: #FFFFFF;
      border-color: var(--primary);
    }

    .btn:active {
      transform: scale(0.98);
    }

    /* Mobile Responsive */
    @media (max-width: 950px) {
      nav {
        flex-direction: column;
        align-items: stretch;
        gap: 8px;
      }

      .nav-links {
        overflow-x: auto;
        justify-content: flex-start;
        border-radius: 12px;
      }

      .nav-links a {
        flex: unset;
        padding: 6px 14px;
      }

      .nav-immortalls {
        justify-content: center;
        border-radius: 12px;
        padding: 10px;
      }

      .container {
        margin: 24px auto;
        padding: 0 16px;
      }

      .member-card {
        flex-direction: column;
        align-items: flex-start;
        gap: 16px;
        padding: 20px;
      }

      .member-info .role {
        display: block;
        margin-left: 0;
        margin-top: 4px;
      }

      .btn {
        width: 100%;
        justify-content: center;
      }
    }
  </style>
</head>
