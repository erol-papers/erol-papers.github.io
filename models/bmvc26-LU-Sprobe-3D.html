<style>html,body{margin:0;padding:0;width:100%;height:100%;background:#fff;overflow:hidden}</style>
<div id="wrap" style="position:fixed;inset:0;width:100vw;height:100vh;background:#fff;overflow:hidden;">
<canvas id="c" style="width:100%;height:100%;display:block;"></canvas>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
const canvas = document.getElementById('c');
const wrap = document.getElementById('wrap');
const W = wrap.clientWidth||680, H = wrap.clientHeight||640;

const renderer = new THREE.WebGLRenderer({canvas, antialias:true, alpha:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.setSize(W,H,false);
renderer.setClearColor(0x000000,0);
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(36, W/H, 0.05, 500);

/* ───────── studio environment (soft boxes) for realistic reflections ───────── */
(function makeEnv(){
  const env = new THREE.Scene();
  const dome = new THREE.Mesh(new THREE.SphereGeometry(60,32,16),
    new THREE.MeshBasicMaterial({color:0x1c1f25, side:THREE.BackSide}));
  env.add(dome);
  function panel(w,h,pos,intensity){
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w,h),
      new THREE.MeshBasicMaterial({color:new THREE.Color(intensity,intensity,intensity), side:THREE.DoubleSide}));
    m.position.set(...pos); m.lookAt(0,0,0); env.add(m);
  }
  panel(40,18,[0,45,10],6.0);     // overhead strip
  panel(18,30,[-45,10,15],3.5);   // left softbox
  panel(18,30,[45,5,-20],2.5);    // right softbox
  panel(60,6,[0,-40,0],0.9);      // faint floor bounce
  const pm = new THREE.PMREMGenerator(renderer);
  scene.environment = pm.fromScene(env,0.02).texture;
  pm.dispose();
})();
const key = new THREE.DirectionalLight(0xffffff, 0.9);
key.position.set(8,14,10); scene.add(key);

/* ───────── LUS probe geometry (viewpoint O = origin) ───────── */
const R = 1.4;                  // probe radius
const L = 7.0;                  // half-length of the cylindrical head
const ALPHA = 28*Math.PI/180;   // bend angle
const RB = 4.5;                 // bend centre-line radius
const LS = 11.0;                // visible shaft length
const RSH = R;              // shaft radius

const C = new THREE.Vector3(-3.3, 0.5, -5.0);               // head centre
const u = new THREE.Vector3(0.96, 0.14, -0.23).normalize(); // head axis → tip

let ref = new THREE.Vector3(0,1,0);
if(Math.abs(u.dot(ref))>0.9) ref.set(1,0,0);
const e1 = new THREE.Vector3().crossVectors(ref,u).normalize();
const e2 = new THREE.Vector3().crossVectors(u,e1).normalize();

function cylPt(th,t){
  return C.clone().addScaledVector(u,t)
          .addScaledVector(e1,R*Math.cos(th)).addScaledVector(e2,R*Math.sin(th));
}

/* contour generator seen from the origin
   cylinder: n·C = −R (independent of t); tip: silhouette circle of the cap sphere, distal half only */
const c1 = C.dot(e1), c2 = C.dot(e2), rho = Math.hypot(c1,c2);
const phi0 = Math.atan2(c2,c1);
const acv  = Math.acos(Math.max(-1,Math.min(1,-R/rho)));
const th1 = phi0+acv, th2 = phi0-acv;

const S = C.clone().addScaledVector(u,L);
const Sl = S.length(), frac = R*R/(Sl*Sl);
const Cc = S.clone().multiplyScalar(1-frac);
const rc = R*Math.sqrt(1-frac);
const Sh = S.clone().normalize();
let bx = new THREE.Vector3(1,0,0);
if(Math.abs(Sh.dot(bx))>0.9) bx.set(0,1,0);
const by = new THREE.Vector3().crossVectors(Sh,bx).normalize();
bx = new THREE.Vector3().crossVectors(by,Sh).normalize();

const NS=2048, samples=[], keep=[];
for(let i=0;i<NS;i++){
  const a=i/NS*Math.PI*2;
  const p=Cc.clone().addScaledVector(bx,rc*Math.cos(a)).addScaledVector(by,rc*Math.sin(a));
  samples.push(p); keep.push(p.clone().sub(C).dot(u) >= L-0.01);
}
let start=-1;
for(let i=0;i<NS;i++){ if(keep[i]&&!keep[(i+NS-1)%NS]){start=i;break;} }
let arc=[];
if(start>=0){ for(let k=0;k<NS;k++){const i=(start+k)%NS; if(!keep[i])break; arc.push(samples[i]);} }
else if(keep.every(k=>k)) arc=samples.slice();
if(arc.length>1){
  const j1=cylPt(th1,L);
  if(arc[0].distanceTo(j1)>arc[arc.length-1].distanceTo(j1)) arc.reverse();
}
const N=80, pts=[];
for(let i=0;i<=N;i++) pts.push(cylPt(th1,-L+2*L*i/N));
pts.push(...arc);
for(let i=0;i<=N;i++) pts.push(cylPt(th2, L-2*L*i/N));

const orangeMat = new THREE.MeshBasicMaterial({color:new THREE.Color(0xff7a00).convertSRGBToLinear(), toneMapped:false});
const tealMat = new THREE.MeshBasicMaterial({color:new THREE.Color(0x00b896).convertSRGBToLinear(), toneMapped:false});
scene.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts,false,'catmullrom',0.01),pts.length*3,0.05,10,false),orangeMat));
const normPts = pts.map(p=>p.clone().normalize());
scene.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(normPts,false,'catmullrom',0.01),normPts.length*3,0.028,10,false),tealMat));

/* ───────── realistic probe materials ───────── */
const headMat = new THREE.MeshPhysicalMaterial({color:0x030304, roughness:0.2, metalness:0.0,
  clearcoat:1.0, clearcoatRoughness:0.06, envMapIntensity:1.0, side:THREE.DoubleSide});
const bendMat = new THREE.MeshPhysicalMaterial({color:0x050506, roughness:0.4, metalness:0.0,
  clearcoat:0.5, clearcoatRoughness:0.25, envMapIntensity:1.1, side:THREE.DoubleSide});
const shaftMat = new THREE.MeshStandardMaterial({color:0x0f1013, roughness:0.45, metalness:0.65, envMapIntensity:1.2});
const seamMat = new THREE.MeshStandardMaterial({color:0x4a4e57, roughness:0.35, metalness:0.9, envMapIntensity:1.3});
const Y = new THREE.Vector3(0,1,0);

// head
const qU = new THREE.Quaternion().setFromUnitVectors(Y,u);
const cyl = new THREE.Mesh(new THREE.CylinderGeometry(R,R,2*L,96,1,true),headMat);
cyl.position.copy(C); cyl.quaternion.copy(qU); scene.add(cyl);
const tip = new THREE.Mesh(new THREE.SphereGeometry(R,96,48,0,Math.PI*2,0,Math.PI/2),headMat);
tip.position.copy(S); tip.quaternion.copy(qU); scene.add(tip);

// head / bend seam
const E = C.clone().addScaledVector(u,-L);
const d0 = u.clone().negate();
const seam = new THREE.Mesh(new THREE.CylinderGeometry(R*1.003,R*1.003,0.22,96,1,false),seamMat);
seam.position.copy(E).addScaledVector(u,-0.11); seam.quaternion.copy(qU); scene.add(seam);

// bend
const bendPts=[];
for(let i=0;i<=40;i++){
  const ph=ALPHA*i/40;
  bendPts.push(E.clone().addScaledVector(d0,RB*Math.sin(ph)).addScaledVector(e2,RB*(1-Math.cos(ph))));
}
scene.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(bendPts),60,R,64,false),bendMat));

// bend / shaft collar + shaft
const E2 = bendPts[bendPts.length-1].clone();
const d1 = d0.clone().multiplyScalar(Math.cos(ALPHA)).addScaledVector(e2,Math.sin(ALPHA)).normalize();
const qD1 = new THREE.Quaternion().setFromUnitVectors(Y,d1);
const collar = new THREE.Mesh(new THREE.CylinderGeometry(R*1.003,R*1.003,0.9,96),seamMat);
collar.position.copy(E2).addScaledVector(d1,0.35); collar.quaternion.copy(qD1); scene.add(collar);
const shaft = new THREE.Mesh(new THREE.CylinderGeometry(RSH,RSH,LS,64,1,false),shaftMat);
shaft.position.copy(E2).addScaledVector(d1,LS/2); shaft.quaternion.copy(qD1); scene.add(shaft);

// handle housing at the end of the shaft
const Hs = E2.clone().addScaledVector(d1,LS);
const hCol = new THREE.Mesh(new THREE.CylinderGeometry(R*1.003,R*1.003,0.8,96),seamMat);
hCol.position.copy(Hs).addScaledVector(d1,0.4); hCol.quaternion.copy(qD1); scene.add(hCol);
const housing = new THREE.Mesh(new THREE.CylinderGeometry(R,R,5.0,96),bendMat);
housing.position.copy(Hs).addScaledVector(d1,0.8+2.5); housing.quaternion.copy(qD1); scene.add(housing);
const ring = new THREE.Mesh(new THREE.CylinderGeometry(R*1.003,R*1.003,0.3,96),seamMat);
ring.position.copy(Hs).addScaledVector(d1,0.8+4.7); ring.quaternion.copy(qD1); scene.add(ring);

/* ───────── unit sphere & viewing rays ───────── */
const glass = new THREE.MeshPhysicalMaterial({color:0x7aa2ee, transparent:true, opacity:0.16, roughness:0.15,
  metalness:0, clearcoat:1, side:THREE.DoubleSide, depthWrite:false});
scene.add(new THREE.Mesh(new THREE.SphereGeometry(1,64,40),glass));
scene.add(new THREE.Mesh(new THREE.SphereGeometry(1.002,18,12),
  new THREE.MeshBasicMaterial({color:0x4466cc,wireframe:true,transparent:true,opacity:0.14})));

const rMat = new THREE.LineBasicMaterial({color:0xffa94d,transparent:true,opacity:0.35});
const step = Math.max(1,Math.floor(pts.length/24));
for(let i=0;i<pts.length;i+=step)
  scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,0),pts[i]]),rMat));
scene.add(new THREE.Mesh(new THREE.SphereGeometry(0.06,16,16),new THREE.MeshBasicMaterial({color:0x111111})));

/* ───────── 360° quaternion trackball ───────── */
const target = C.clone().multiplyScalar(0.5).addScaledVector(d1,1.5);
const qs = new URLSearchParams(location.search);
let radius = parseFloat(qs.get('r')||'27');
const basePos = new THREE.Vector3(0,0,radius);
const Q = new THREE.Quaternion().setFromEuler(
  new THREE.Euler(parseFloat(qs.get('pitch')||'0.3'),parseFloat(qs.get('yaw')||'0.95'),0,'YXZ'));
function moveCamera(){
  camera.position.copy(target).add(basePos.clone().applyQuaternion(Q));
  camera.up.copy(new THREE.Vector3(0,1,0).applyQuaternion(Q));
  camera.lookAt(target);
}
moveCamera();
function applyDelta(dx,dy){
  const qYaw=new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,1,0),-dx*0.007);
  const right=new THREE.Vector3(1,0,0).applyQuaternion(Q);
  const qPitch=new THREE.Quaternion().setFromAxisAngle(right,-dy*0.007);
  Q.premultiply(qYaw).premultiply(qPitch).normalize(); moveCamera();
}
let drag=false,ox=0,oy=0;
canvas.addEventListener('mousedown',e=>{drag=true;ox=e.clientX;oy=e.clientY;});
window.addEventListener('mouseup',()=>drag=false);
canvas.addEventListener('mousemove',e=>{if(!drag)return;applyDelta(e.clientX-ox,e.clientY-oy);ox=e.clientX;oy=e.clientY;});
canvas.addEventListener('wheel',e=>{radius=Math.max(4,Math.min(80,radius+e.deltaY*0.03));basePos.set(0,0,radius);moveCamera();e.preventDefault();},{passive:false});
let tc=null;
canvas.addEventListener('touchstart',e=>{tc=e.touches[0];},{passive:true});
canvas.addEventListener('touchmove',e=>{if(!tc)return;const t=e.touches[0];applyDelta(t.clientX-tc.clientX,t.clientY-tc.clientY);tc=t;e.preventDefault();},{passive:false});
(function animate(){requestAnimationFrame(animate);renderer.render(scene,camera);})();
window.addEventListener('resize',()=>{
  const W=wrap.clientWidth||680,H=wrap.clientHeight||640;
  renderer.setSize(W,H,false);camera.aspect=W/H;camera.updateProjectionMatrix();
});
})();
</script>
</div>
